services:
  web:
    build:
      context: .
      dockerfile: DOCKERFILE.dockerfile
    ports:
      - "5000:5000"
    environment:
      APP_ENV: production
      COOKIE_SECURE: "false"
      DATABASE_URL: sqlite:////data/nexadesk.db
      SECRET_KEY: ${SECRET_KEY:?Copy .env.example to .env and set SECRET_KEY}
    volumes:
      - nexadesk-data:/data
    restart: unless-stopped

volumes:
  nexadesk-data:
