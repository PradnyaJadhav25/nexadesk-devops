{% extends "base.html" %}
{% block title %}Initial setup{% endblock %}
{% block auth_content %}
<section class="auth-card">
  <div class="eyebrow">WELCOME TO YOUR SERVICE DESK</div>
  <h1>Set up your workspace</h1>
  <p class="muted-copy">Create the first administrator account. You can add support agents and requesters after signing in.</p>
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="name">Your name</label>
    <input id="name" name="name" autocomplete="name" maxlength="80" required>
    <label for="email">Work email</label>
    <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
    <small class="field-hint">Use at least 10 characters.</small>
    <button class="button button-primary button-wide" type="submit">Create administrator account <span>→</span></button>
  </form>
</section>
{% endblock %}
