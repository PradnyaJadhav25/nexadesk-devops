
name: NexaDesk CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout:
    name: "1. Checkout Code"
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

  setup:
    name: "2. Setup Python"
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

  install:
    name: "3. Install Dependencies"
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and quality tools
        run: python -m pip install -r requirements-dev.txt

  tests:
    name: "4. Run Tests"
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  lint:
    name: "5. Lint Code"
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check app.py tests

  security:
    name: "6. Security Scan"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Scan source with Bandit
        run: bandit -q -r app.py

  audit:
    name: "7. Dependency Audit"
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  docker-build:
    name: "8. Docker Build"
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build production image
        run: docker build --file DOCKERFILE.dockerfile --tag nexadesk:ci .
